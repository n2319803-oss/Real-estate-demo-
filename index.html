<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delhi Property Enquiry</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .hero {
      background: #17324d;
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 36px;
    }

    .hero p {
      margin: 0;
      font-size: 18px;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .form-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #17324d;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #success {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #e8f5e9;
      border-radius: 7px;
      text-align: center;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>Find Your Perfect Property</h1>
    <p>Tell us what you're looking for and our property expert will contact you.</p>
  </section>

  <div class="container">

    <div class="form-box">
      <h2>Property Enquiry</h2>

      <form id="leadForm">

        <label>Your Name</label>
        <input type="text" name="Name" required>

        <label>Phone or Email</label>
        <input type="text" name="Phone or email" required>

        <label>Budget</label>
        <input type="text" name="Budget" placeholder="Example: ₹50 Lakh" required>

        <label>Location</label>
        <input type="text" name="Location" placeholder="Example: Delhi" required>

        <label>Property Type</label>
        <select name="Property type" required>
          <option value="">Select property type</option>
          <option>1 BHK</option>
          <option>2 BHK</option>
          <option>3 BHK</option>
          <option>4 BHK</option>
          <option>Villa</option>
          <option>Plot</option>
          <option>Commercial</option>
        </select>

        <label>Buying Timeline</label>
        <select name="Buying timeline" required>
          <option value="">Select timeline</option>
          <option>Within 7 days</option>
          <option>Within 1 month</option>
          <option>1–3 months</option>
          <option>Just exploring</option>
        </select>

        <label>Site Visit Interest</label>
        <select name="Site visit interest" required>
          <option value="">Select an option</option>
          <option>Yes</option>
          <option>Maybe</option>
          <option>No</option>
        </select>

        <button type="submit">Submit Enquiry</button>

        <div id="success">
          Thank you! Your enquiry has been received.
        </div>

      </form>
    </div>

  </div>

  <script>
    const form = document.getElementById("leadForm");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      await fetch("YOUR_N8N_WEBHOOK_URL", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      form.reset();
      document.getElementById("success").style.display = "block";
    });
  </script>

</body>
</html>
